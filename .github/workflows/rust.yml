name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 */3 * * *"  # every 3 hours
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-maintain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      # ---- NORMAL CI ----
      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      # ---- SAFE AUTO FIXES ----
      - name: Format code
        run: cargo fmt

      - name: Apply Clippy fixes
        run: cargo clippy --fix --allow-dirty --allow-staged || true

      # ---- RE-RUN TESTS AFTER FIXES ----
      - name: Verify after fixes
        run: cargo test --verbose

      # ---- COMMIT IF SAFE ----
      - name: Commit changes
        run: |
          git config --global user.name "auto-maintainer-bot"
          git config --global user.email "bot@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Auto: format and clippy fixes"
            git push
          else
            echo "No changes to commit"
          fi
